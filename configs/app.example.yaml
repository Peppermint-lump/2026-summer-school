capture:
  camera:
    enabled: false  # 必须由用户在 UI 中主动开启
    device_index: 0
    width: 640
    height: 480
    target_fps: 10
    buffer_seconds: 30
    sample_fps: 2
    max_sampled_frames: 12
    retain_media: false

emotion:
  audio:
    enabled: false
    provider: mimo
    model: mimo-v2.5
    base_url: "https://api.xiaomimimo.com/v1"
    api_key_secret_name: MIMO_API_KEY
    timeout_seconds: 20
    max_retries: 2
    prompt_path: configs/prompts/audio_emotion_v1.txt
    prompt_version: audio_emotion_v1
    minimum_quality: 0.35
    max_media_bytes: 25165824
  video:
    enabled: false
    provider: mimo
    model: mimo-v2.5
    base_url: "https://api.xiaomimimo.com/v1"
    api_key_secret_name: MIMO_API_KEY
    timeout_seconds: 20
    max_retries: 2
    prompt_path: configs/prompts/video_emotion_v1.txt
    prompt_version: video_emotion_v1
    minimum_quality: 0.45
    action_minimum_confidence: 0.60
    action_emotion_weight: 0.25
  text:
    enabled: false
    provider: glm
    model: glm-4.7-flash
    base_url: "https://open.bigmodel.cn/api/paas/v4"
    api_key_secret_name: GLM_API_KEY
    timeout_seconds: 12
    max_retries: 2
    prompt_path: configs/prompts/text_emotion_v1.txt
    prompt_version: text_emotion_v1

fusion:
  reliable_threshold: 0.55
  positive_threshold: 0.25
  negative_threshold: -0.25
  text_weight: 0.45
  audio_weight: 0.25
  video_weight: 0.30
